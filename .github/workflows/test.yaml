name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: rxliuli/setup-pnpm@v1
      - name: Install dependencies
        run: pnpm install
      - name: Type check
        run: pnpm compile
      - name: Tests
        run: pnpm test
